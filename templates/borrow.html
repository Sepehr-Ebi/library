{% extends "base.html" %}



{% block title %}

امانت دادن کتاب

{% endblock %}




{% block content %}



<div class="row justify-content-center">


    <div class="col-lg-6">



        <div class="card shadow">



            <div class="card-body p-5">



                <h2 class="text-center mb-4">

                    <i class="bi bi-box-arrow-down"></i>

                    امانت دادن کتاب

                </h2>




                <div class="alert alert-info text-center">


                    <div class="fs-1 mb-2">

                        📖

                    </div>


                    <p class="mb-1">

                        عنوان کتاب:

                    </p>



                    <strong dir="auto" class="fs-5">

                        {{ book["title"] }}

                    </strong>


                </div>






                <form method="POST">





                    <div class="mb-4">


                        <label class="form-label fw-bold">

                            <i class="bi bi-person"></i>

                            نام امانت گیرنده

                        </label>



                        <input

                        type="text"

                        name="borrower"

                        class="form-control form-control-lg"

                        placeholder="نام فردی که کتاب را می‌گیرد"

                        required

                        >



                    </div>








                    <div class="d-flex gap-2">



                        <button

                        type="submit"

                        class="btn btn-success flex-fill btn-lg">


                            <i class="bi bi-check-circle"></i>

                            ثبت امانت


                        </button>







                        <a

                        href="/book/{{ book_id }}"

                        class="btn btn-secondary flex-fill btn-lg">


                            <i class="bi bi-arrow-right"></i>

                            بازگشت


                        </a>



                    </div>






                </form>





            </div>


        </div>



    </div>


</div>




{% endblock %}
