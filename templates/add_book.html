{% extends "base.html" %}



{% block title %}

افزودن کتاب

{% endblock %}




{% block content %}



<div class="row justify-content-center">


<div class="col-lg-6">



<div class="card">



<div class="card-body p-5">



<h1 class="text-center mb-4">

<i class="bi bi-plus-circle"></i>

افزودن کتاب جدید

</h1>



<form method="POST">





<div class="mb-3">


<label class="form-label">

📖 عنوان کتاب

</label>


<input

type="text"

name="title"

class="form-control"

placeholder="نام کتاب"

required

>


</div>







<div class="mb-3">


<label class="form-label">

👤 نویسنده

</label>


<input

type="text"

name="author"

class="form-control"

placeholder="نام نویسنده"

required

>


</div>







<div class="mb-3">


<label class="form-label">

📅 سال انتشار

</label>


<input

type="number"

name="year"

class="form-control"

placeholder="مثلا 2024"

required

>


</div>







<div class="mb-4">


<label class="form-label">

🏷 ژانر

</label>


<input

type="text"

name="genre"

class="form-control"

placeholder="ژانر کتاب"

required

>


</div>







<div class="d-flex gap-2">



<button

type="submit"

class="btn btn-success flex-fill">


<i class="bi bi-check-circle"></i>

ثبت کتاب


</button>





<a

href="/"

class="btn btn-secondary flex-fill">


<i class="bi bi-arrow-right"></i>

بازگشت


</a>




</div>





</form>




</div>


</div>


</div>


</div>




{% endblock %}
