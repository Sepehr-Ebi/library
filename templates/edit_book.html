{% extends "base.html" %}


{% block title %}

ویرایش کتاب

{% endblock %}



{% block content %}



<div class="row justify-content-center">


<div class="col-lg-6">



<div class="card">


<div class="card-body p-5">



<h2 class="text-center mb-4">

✏️ ویرایش کتاب

</h2>



<form method="POST">



<div class="mb-3">

<label class="form-label">

📖 عنوان کتاب

</label>


<input

type="text"

name="title"

class="form-control"

value="{{ book['title'] }}"

required

>

</div>





<div class="mb-3">

<label class="form-label">

👤 نویسنده

</label>


<input

type="text"

name="author"

class="form-control"

value="{{ book['author'] }}"

required

>

</div>





<div class="mb-3">

<label class="form-label">

📅 سال

</label>


<input

type="number"

name="year"

class="form-control"

value="{{ book['year'] }}"

required

>

</div>





<div class="mb-4">

<label class="form-label">

🏷 ژانر

</label>


<input

type="text"

name="genre"

class="form-control"

value="{{ book['genre'] }}"

required

>

</div>





<div class="d-flex gap-2">


<button

type="submit"

class="btn btn-warning flex-fill">

ذخیره تغییرات

</button>




<a

href="/book/{{ book_id }}"

class="btn btn-secondary flex-fill">

بازگشت

</a>



</div>




</form>



</div>


</div>


</div>


</div>



{% endblock %}
